name: Verify public release
on:
  push:
    branches:
      - fix/public-sessions-metrika-20261101
  pull_request:
    branches:
      - infra/yandex-production-deploy
permissions:
  contents: read
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      NEXT_PUBLIC_APP_URL: https://xn--80ajjjbhwgdz8k.xn--p1ai
      NEXT_PUBLIC_YANDEX_METRIKA_ID: "113976341"
      AUTH_SECRET: "github-actions-test-only-not-production-secret"
      QR_SIGNING_SECRET: "github-actions-test-only-not-production-qr"
      CRON_SECRET: "github-actions-test-only-not-production-cron"
      ALLOWED_HOSTS: "xn--80ajjjbhwgdz8k.xn--p1ai"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
