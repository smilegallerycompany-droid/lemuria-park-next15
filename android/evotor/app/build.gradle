plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'ru.lemuriapark.cashier'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'ru.lemuriapark.cashier'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '0.1.3'
        manifestPlaceholders.evotorAppUuid = providers.gradleProperty('evotorAppUuid').get()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.github.evotor:integration-library:v0.6.29'
    implementation 'com.github.evotor:query-api:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
