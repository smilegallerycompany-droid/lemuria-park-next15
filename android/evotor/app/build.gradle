plugins {
    id 'com.android.application' version '8.7.3'
}
def replacement = providers.gradleProperty('evotorReplacement').orNull == 'true'
def appUuid = providers.gradleProperty('evotorAppUuid').get()
if (!(appUuid ==~ /(?i)[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}/)) {
    throw new GradleException('Set evotorAppUuid to the UUID of the application in the Evotor developer portal')
}
if (replacement && appUuid.equalsIgnoreCase('d67c78e8-ee63-4bf7-81ab-4766da84336b')) {
    throw new GradleException('The replacement package requires its own Evotor application UUID')
}
def expectedCertificate = replacement
    ? 'd91253504e29b80dc6b3cf19e3723a22cac170138e20b48428d9cf06c5b7cb60'
    : 'e697bff5efb8c5227b78f7fe6637a97a940550623535c6df19ddcec8092b1d10'
// Keep each package on its own signing certificate across releases.
def signingEnv = ['EVOTOR_KEYSTORE', 'EVOTOR_STORE_PASSWORD', 'EVOTOR_KEY_ALIAS', 'EVOTOR_KEY_PASSWORD']
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested) {
    def missing = signingEnv.findAll { !System.getenv(it) }
    if (!missing.empty) throw new GradleException('Release signing requires: ' + missing.join(', '))
    def store = java.security.KeyStore.getInstance(System.getenv('EVOTOR_KEYSTORE_TYPE') ?: 'JKS')
    file(System.getenv('EVOTOR_KEYSTORE')).withInputStream { stream ->
        store.load(stream, System.getenv('EVOTOR_STORE_PASSWORD').toCharArray())
    }
    def alias = System.getenv('EVOTOR_KEY_ALIAS')
    if (!store.isKeyEntry(alias)) throw new GradleException('Signing alias has no private key')
    def certificate = store.getCertificate(alias)
    def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
    if (fingerprint != expectedCertificate) {
        throw new GradleException('Signing certificate does not match this package')
    }
}
android {
    namespace 'ru.lemuriapark.cashier'
    compileSdk 35
    buildToolsVersion "35.0.0"
    signingConfigs {
        release {
            if (releaseRequested) {
                storeFile file(System.getenv('EVOTOR_KEYSTORE'))
                storePassword System.getenv('EVOTOR_STORE_PASSWORD')
                keyAlias System.getenv('EVOTOR_KEY_ALIAS')
                keyPassword System.getenv('EVOTOR_KEY_PASSWORD')
                storeType System.getenv('EVOTOR_KEYSTORE_TYPE') ?: 'JKS'
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId replacement ? 'ru.lemuriapark.cashier.replacement' : 'ru.lemuriapark.cashier'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '0.1.3'
        manifestPlaceholders.evotorAppUuid = appUuid
        manifestPlaceholders.cashierLabel = replacement ? 'Лемурия Парк · тестовая касса' : 'Лемурия Парк · касса'
        buildConfigField 'boolean', 'STAGING_ONLY', replacement.toString()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.github.evotor:integration-library:v0.6.29'
    implementation 'com.github.evotor:query-api:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!releaseRequested) throw new GradleException('Use assembleRelease explicitly with verified signing credentials')
        }
    }
}
